behaviors:
  Kart:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 2000
    checkpoint_interval: 20000
    keep_checkpoints: 5
engine_settings:
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
